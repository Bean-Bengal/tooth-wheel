<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tooth Wheel</title>
<style>*{box-sizing:border-box}body{font-family:sans-serif;margin:0;padding:12px;background:#f4efe6;color:#222}
label{display:block;margin:8px 0}input{font-size:20px;width:90px;height:44px;padding:0 8px}
canvas{width:100%;max-width:420px;aspect-ratio:1;background:#fff;border:2px solid #222;display:block}
#b{padding:6px;margin-top:10px;font-size:14px}.ok{background:#bfe8b8}.bad{background:#f3b0b0}</style></head><body>
<script data-bean-store>(function(){if(typeof location!=='undefined'&&location&&location.protocol==='about:'&&typeof document!=='undefined'&&document.addEventListener){document.addEventListener('click',function(e){var a=e.target&&e.target.closest&&e.target.closest('a[href^="#"]');if(!a||a.target==='_blank')return;e.preventDefault();try{location.hash=a.getAttribute('href')}catch(x){}},true)}if(typeof window==='undefined')return;try{window.localStorage.getItem('x');return}catch(e){}var d=Object.assign({},window.__BEAN_SAVED||{});function post(){try{parent.postMessage({type:'bean-store',data:d},'*')}catch(e){}}var ls={getItem:function(k){return Object.prototype.hasOwnProperty.call(d,k)?d[k]:null},setItem:function(k,v){d[k]=String(v);post()},removeItem:function(k){delete d[k];post()},clear:function(){d={};post()},key:function(i){return Object.keys(d)[i]||null}};Object.defineProperty(ls,'length',{get:function(){return Object.keys(d).length}});try{Object.defineProperty(window,'localStorage',{value:ls,configurable:true})}catch(e){}})();</script>
<h1>Tooth Wheel</h1>
<label>Teeth <input id="n" type="number" min="3" max="200" value="60"></label>
<div id="info"></div>
<canvas id="c"></canvas>
<div id="b"></div>
<script>
function toothAngle(n){return 2*Math.PI/n}
function clampN(v){v=Math.floor(Number(v));if(!(v>=3))return 3;return v>200?200:v}
function draw(n){
 var c=document.getElementById('c'),d=window.devicePixelRatio||1,s=c.clientWidth||360;
 c.width=Math.round(s*d);c.height=Math.round(s*d);var x=c.getContext('2d');x.setTransform(c.width/s,0,0,c.width/s,0,0);
 var cx=s/2,cy=s/2,R=s*0.45,r=R*Math.max(0.78,1-Math.min(0.2,6/n)),a=toothAngle(n);
 x.beginPath();
 for(var i=0;i<n;i++){var t=i*a-Math.PI/2;
  var p=[[t,r],[t+a*0.2,R],[t+a*0.5,R],[t+a*0.7,r]];
  for(var j=0;j<4;j++){var px=cx+Math.cos(p[j][0])*p[j][1],py=cy+Math.sin(p[j][0])*p[j][1];
   if(i==0&&j==0)x.moveTo(px,py);else x.lineTo(px,py);}}
 x.closePath();x.fillStyle='#d9a441';x.fill();x.lineWidth=1.5;x.strokeStyle='#222';x.stroke();
 x.beginPath();x.arc(cx,cy,r*0.2,0,7);x.fillStyle='#fff';x.fill();x.stroke();
 document.getElementById('info').textContent=n+' teeth, '+(a*180/Math.PI).toFixed(2)+'° per tooth';
}
var inp=document.getElementById('n');
function go(){draw(clampN(inp.value))}
inp.oninput=go;window.onresize=go;
try{
 var ok=Math.abs(toothAngle(60)*60-2*Math.PI)<1e-9&&Math.abs(toothAngle(60)*180/Math.PI-6)<1e-9&&clampN(1)==3&&clampN(500)==200&&clampN('60')==60&&clampN('')==3;
 var bad=Math.abs(Math.PI/60*60-2*Math.PI)<1e-9;
 var b=document.getElementById('b');
 if(ok&&!bad){b.textContent='checks passed';b.className='ok'}else{b.textContent='checks FAILED';b.className='bad'}
}catch(e){var b2=document.getElementById('b');b2.textContent='checks FAILED: '+e;b2.className='bad'}
go();
</script></body></html>
